<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuesGuard - Authentication</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="brand">
      <div class="brand-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm0 2.18l6 2.25v4.66c0 4.14-2.73 8.01-6 9.07-3.27-1.06-6-4.93-6-9.07V6.43l6-2.25z"/></svg>
      </div>
      <h1>DuesGuard</h1>
      <p id="auth-subtitle">Welcome back. Enter your credentials to access your account.</p>
    </div>

    <div class="auth-tabs" id="authTabs">
      <button class="tab-btn active" id="tabLogin" type="button">Login</button>
      <button class="tab-btn" id="tabSignup" type="button">Sign Up</button>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" required placeholder="name@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label for="loginPassword" style="margin-bottom: 0;">Password</label>
          <a href="#" id="forgotPasswordLink" class="link-text">Forgot password?</a>
        </div>
        <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="submit-btn" id="loginBtn">Log In</button>
    </form>

    <!-- Forgot Password Form -->
    <form id="forgotForm" style="display: none;">
      <div class="form-group">
        <label for="forgotEmail">Registered Email</label>
        <input type="email" id="forgotEmail" required placeholder="name@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
      </div>
      <button type="submit" class="submit-btn" id="resetBtn">Reset Password</button>
      <div style="text-align: center; margin-top: 1rem;">
        <a href="#" id="backToLoginLink" class="link-text">← Back to Login</a>
      </div>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" style="display: none;">
      <div class="form-group">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" required placeholder="Jane Doe" autocomplete="name">
      </div>
      <div class="form-group">
        <label for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail" required placeholder="name@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
      </div>
      <button type="submit" class="submit-btn" id="signupBtn">Create Account</button>
    </form>

    <!-- Logged In / Dashboard Page -->
    <div id="loggedInState" class="user-status">
      <div class="welcome-avatar">
        <span id="userInitial">U</span>
      </div>
      <h2 class="welcome-title">Hello, <span id="userName">User</span>!</h2>
      <p class="welcome-email" id="userEmail"></p>
      
      <div class="user-card-badge">
        <span class="status-indicator"></span> Verified Member
      </div>

      <!-- Business Section in Dashboard -->
      <div class="business-section">
        <div class="business-header">
          <h3>Register Your Business</h3>
          <p>Link your business profile to your account (<span id="bizUserEmailBadge"></span>)</p>
        </div>

        <div id="bizAlertBox" class="alert-box" style="margin-top: 1rem;"></div>

        <form id="businessForm" class="business-form">
          <div class="form-group">
            <label for="bizName">Business Name *</label>
            <input type="text" id="bizName" required placeholder="e.g. Acme Tech Solutions">
          </div>
          <div class="form-group">
            <label for="bizType">Business Category / Type</label>
            <input type="text" id="bizType" placeholder="e.g. Retail, Software, Services">
          </div>
          <div class="form-group">
            <label for="bizPhone">Contact Phone</label>
            <input type="tel" id="bizPhone" placeholder="+1 (555) 000-0000">
          </div>
          <div class="form-group">
            <label for="bizAddress">Business Address</label>
            <input type="text" id="bizAddress" placeholder="Street, City, Country">
          </div>
          <button type="submit" class="submit-btn" id="bizSubmitBtn">Register Business</button>
        </form>

        <!-- List of Registered Businesses -->
        <div class="biz-list-wrapper">
          <h4>Your Registered Businesses</h4>
          <div id="businessesList" class="businesses-list">
            <p class="empty-list-text">No businesses registered yet.</p>
          </div>
        </div>
      </div>

      <button type="button" class="submit-btn logout-btn" id="logoutBtn" style="margin-top: 2rem;">Log Out</button>
    </div>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
